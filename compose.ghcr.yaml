# GHCR production compose — pulls prebuilt images from GitHub Container
# Registry (image-only, no build). Usage:
#
#   cp .env.example .env        # set GHCR_IMAGE_PREFIX, adjust anything else
#   docker compose -f compose.ghcr.yaml up -d
#
# Image tags: default "latest"; pin IMAGE_TAG to a specific build
# (vX.Y.Z or sha-<12hex>) for reproducible deploys and rollbacks.
#
# Identical topology to compose.yaml (local build), and the storage volume is
# shared by name, so switching between build mode and GHCR mode keeps data.
#
# Persistence: the storage-data volume keeps SQLite + files across restarts.

services:
  app:
    image: ${GHCR_IMAGE_PREFIX:?set GHCR_IMAGE_PREFIX in .env, e.g. ghcr.io/your-account/excalidraw}/app:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      WS_SERVER_URL: ${WS_SERVER_URL:-}
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-}
      BACKEND_V2_GET_URL: ${BACKEND_V2_GET_URL:-}
      BACKEND_V2_POST_URL: ${BACKEND_V2_POST_URL:-}
      LIBRARY_URL: ${LIBRARY_URL:-}
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-}
      PLUS_LP: ${PLUS_LP:-}
      PLUS_APP: ${PLUS_APP:-}
      AI_BACKEND: ${AI_BACKEND:-}
      # single source of truth for the image upload limit (frontend checks +
      # storage body limit); default 20 MiB
      MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-20971520}
    depends_on:
      - room
      - storage
    restart: unless-stopped

  room:
    image: ${GHCR_IMAGE_PREFIX}/room:${IMAGE_TAG:-latest}
    environment:
      PORT: "80"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    restart: unless-stopped

  storage:
    image: ${GHCR_IMAGE_PREFIX}/storage:${IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # body limit driven by the same MAX_FILE_UPLOAD_BYTES variable as the
      # frontend (files are stored deflated+encrypted so they never exceed the
      # original size; scenes are small JSON)
      MAX_BODY_BYTES: ${MAX_FILE_UPLOAD_BYTES:-20971520}
    volumes:
      - storage-data:/data
    restart: unless-stopped

volumes:
  storage-data:
    # explicit name shared with compose.yaml: switching between build mode
    # and GHCR image mode keeps the same persistent data
    name: excalidraw-storage-data
